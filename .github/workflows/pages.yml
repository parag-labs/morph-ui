name: Deploy demo

# Builds the Flutter app for web and publishes it to GitHub Pages at
# https://parag-labs.github.io/morph-ui/. The app runs entirely client-side.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build web (served under the repo subpath)
        run: flutter build web --release --base-href /morph-ui/
      - name: Disable Jekyll processing
        run: touch build/web/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/web
          # v4+ drops dotfiles by default; keep .nojekyll in the artifact.
          include-hidden-files: true
      - id: deployment
        uses: actions/deploy-pages@v5
